name: Deploy

# Only a published release deploys, and it deploys both sites: apps/site to
# the Cloudflare Pages project {{SLUG}}-www ({{DOMAIN}}) and apps/docs to
# {{SLUG}}-docs ({{DOCS_DOMAIN}}). No push, pull_request or workflow_dispatch
# trigger: publishing the release is the one "go live" action for both sites.
#
# One switch decides what a release ships: the repository variable
# SITE_COMING_SOON. Set to "true", the release is the coming-soon page alone
# (the site's coming-soon build) and the docs aren't built or deployed. Unset
# or anything else, the full site and the docs ship.
#
# Each project is created on its first deploy if it doesn't exist yet. Custom
# domains are attached once by hand in Cloudflare after that (docs/deploy.md).
# The secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must hold real
# values; nothing here prints either.
on:
  release:
    types: [published]

permissions:
  contents: read

# Deploys queue rather than race: a second release (or an edit and
# republish) waits for the first deploy instead of cancelling it mid-upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare Pages
    # The template itself has nothing to deploy: its placeholders aren't
    # filled. A product's own repo deploys.
    if: github.repository != 'the-rabbit-hole-tech/template-website-docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMING_SOON: ${{ vars.SITE_COMING_SOON == 'true' }}
      SITE_PROJECT: "{{SLUG}}-www"
      DOCS_PROJECT: "{{SLUG}}-docs"
      # A release marked pre-release goes to each project's dev branch (its
      # dev.<project>.pages.dev site), so it can be checked before it reaches
      # production; anything else goes to main. --branch is always explicit,
      # because a release run checks out a detached tag and would otherwise
      # deploy as a preview named "head".
      PAGES_BRANCH: ${{ github.event.release.prerelease && 'dev' || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          # Full history: the docs' "last updated" dates come from each page's
          # own commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The release's docs version must already be cut and merged: the
      # version in packages/frame/release.ts has to be the newest in
      # apps/docs/versions.json. Nothing builds or deploys until it is, so a
      # release can't ship docs without its own version. The fix is a PR that
      # runs `npm run docs:version`, then publishing the release again. A
      # coming-soon release ships no docs, so it skips this.
      - name: Check the docs version for this release
        if: env.COMING_SOON != 'true'
        run: npm run check:docs-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The coming-soon build checks its own output and fails if any of the
      # landing page is in it (apps/site/scripts/check-release-build.ts).
      - name: Build the site
        run: |
          if [ "$COMING_SOON" = "true" ]; then
            echo "coming-soon release: building the coming-soon page alone"
            npm run build:coming-soon -w @product/site
          else
            echo "full release: building the full site"
            npm run build -w @product/site
          fi

      # Both sites build before either deploys, so a failed build never leaves
      # one site on the new release and the other on the old one. The
      # published docs carry vNext (unreleased main) beside the released
      # version, under its banner; the released version stays the default.
      - name: Build the docs
        if: env.COMING_SOON != 'true'
        env:
          DOCS_INCLUDE_NEXT: "true"
        run: npm run build -w @product/docs

      # Each deploy creates its Pages project on the first run only. `--json`
      # gives a real array of {"Project Name": ...} objects to match exactly,
      # instead of grep-ing wrangler's table output (which would also match a
      # longer name that merely starts with this one). wrangler isn't on the
      # PATH inside preCommands, so those calls go through npx.
      - name: Deploy the site
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project list --json | sed -n '/^\[/,$p' | jq -e --arg p "${{ env.SITE_PROJECT }}" '[.[] | select(."Project Name" == $p)] | length > 0' >/dev/null || npx wrangler pages project create "${{ env.SITE_PROJECT }}" --production-branch=main
          command: pages deploy apps/site/build/client --project-name=${{ env.SITE_PROJECT }} --branch=${{ env.PAGES_BRANCH }}

      - name: Deploy the docs
        if: env.COMING_SOON != 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            npx wrangler pages project list --json | sed -n '/^\[/,$p' | jq -e --arg p "${{ env.DOCS_PROJECT }}" '[.[] | select(."Project Name" == $p)] | length > 0' >/dev/null || npx wrangler pages project create "${{ env.DOCS_PROJECT }}" --production-branch=main
          command: pages deploy apps/docs/build --project-name=${{ env.DOCS_PROJECT }} --branch=${{ env.PAGES_BRANCH }}
