name: Label Sync
# Reconciles the repo's labels to the canonical set (.github/labels.yml):
# creates/updates the canonical labels AND deletes any label not in the file,
# so the repo carries exactly this set (no stale GitHub defaults or
# leftover release labels).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
permissions:
  contents: read
  issues: write
jobs:
  labeler:
    name: 🏷️ Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconcile labels with labels.yml
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: false
