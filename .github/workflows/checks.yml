name: Checks

# Lint, test, typecheck and build both apps on a GitHub-hosted Linux runner.
#
# The template is proven the way a product uses it: the first step after
# install fills every placeholder with the fictional Acme product
# (scripts/init-product.mjs --fixture), and everything after runs on that
# filled tree. In a product's own repo that step finds nothing left to fill
# and changes nothing.
#
# One job for both apps, so there is one required check. A change under
# apps/site or apps/docs builds that app only; anything shared (the packages,
# the root manifests, the workflows, the scripts) builds both. Lint and the
# tests are cheap and always run.
#
# Pull requests only, and not while the PR is a draft; the PR run covers what
# merges, so nothing reruns on push to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# One run per PR per workflow: a new push cancels the older PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: 🧪 Build & Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the path filter diffs against the PR's base, and the
          # docs' "last updated" dates come from each page's own commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide which apps to build
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/changed-apps.mjs "${BASE:-}" "${HEAD_SHA:-}" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly the lockfile, including the workspace links,
      # and fails if a manifest and the lock disagree.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fill the placeholders with the Acme fixture
        run: node scripts/init-product.mjs --fixture

      - name: Lint (oxlint and oxfmt)
        run: npm run lint

      - name: Test the packages, the apps and the scripts
        run: npm test

      - name: Site - typecheck
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run typecheck -w @product/site

      - name: Site - build (prerender)
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run build -w @product/site

      - name: Site - check internal links in the prerendered output
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run check:links -w @product/site

      # Nothing may be written to browser storage before the visitor accepts
      # the cookie choice (scripts/check-no-storage.mjs).
      - name: Site - nothing stored before consent
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run check:storage:site

      # The coming-soon build holds the coming-soon page alone; the build
      # script fails if any of the landing page leaks into it.
      - name: Site - coming-soon build
        if: steps.changes.outputs.site_changed == 'true'
        run: npm run build:coming-soon -w @product/site

      # Previews serve the sites under a sub-path; a font URL that ignores the
      # base path only breaks there. The template ships no fonts, so this runs
      # once a product adds one to packages/frame/public/fonts.
      - name: Site - check fonts in a sub-path build
        if: steps.changes.outputs.site_changed == 'true' && hashFiles('packages/frame/public/fonts/*.woff2') != ''
        env:
          PREVIEW_BASE_PATH: /sub-path-check/
        run: |
          npm run build -w @product/site
          node scripts/check-fonts.mjs apps/site/build/client "$PREVIEW_BASE_PATH"

      - name: Docs - typecheck
        if: steps.changes.outputs.docs_changed == 'true'
        run: npm run typecheck -w @product/docs

      # onBrokenLinks and the markdown link hook are set to throw, so a broken
      # internal link fails this step. This build includes vNext, so it checks
      # the released versions and main's pages. It's built under a base path,
      # as the previews are, so a link or an image that skips the base path
      # (a bare '/img/...') fails here rather than only in a preview. The
      # checks below read the same build.
      - name: Docs - build
        if: steps.changes.outputs.docs_changed == 'true'
        env:
          PREVIEW_BASE_PATH: /docs-ci/
        run: npm run build -w @product/docs

      # Every image every page uses, in every version, must be in the build
      # (scripts/check-images.mjs).
      - name: Docs - no missing images
        if: steps.changes.outputs.docs_changed == 'true'
        env:
          PREVIEW_BASE_PATH: /docs-ci/
        run: npm run check:images:docs

      # Loads every page, then hydrates a few and uses the theme, full-width
      # and tab switches: nothing may be stored before consent.
      - name: Docs - nothing stored before consent
        if: steps.changes.outputs.docs_changed == 'true'
        env:
          PREVIEW_BASE_PATH: /docs-ci/
        run: npm run check:storage:docs

      - name: Docs - the release's docs version is cut
        if: steps.changes.outputs.docs_changed == 'true'
        run: npm run check:docs-version

      - name: Docs - check fonts in a sub-path build
        if: steps.changes.outputs.docs_changed == 'true' && hashFiles('packages/frame/public/fonts/*.woff2') != ''
        env:
          PREVIEW_BASE_PATH: /sub-path-check/
          DOCS_INCLUDE_NEXT: "false"
        run: |
          npm run build -w @product/docs -- --out-dir build-sub-path
          node scripts/check-fonts.mjs apps/docs/build-sub-path "$PREVIEW_BASE_PATH"
