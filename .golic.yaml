# The short Apache-2.0 header: two SPDX lines above the code, written as line comments:
#   // Copyright 2026 The template-website-docs Authors
#   // SPDX-License-Identifier: Apache-2.0
# golic ships no rules for the TypeScript and JavaScript module types, so they're set here.
golic:
  licenses:
    spdx-apache2: |
      Copyright {{copyright}}
      SPDX-License-Identifier: Apache-2.0
  rules:
    .ts:
      prefix: "// "
    .tsx:
      prefix: "// "
    .mts:
      prefix: "// "
    .cts:
      prefix: "// "
    .js:
      prefix: "// "
    .mjs:
      prefix: "// "
    .cjs:
      prefix: "// "
